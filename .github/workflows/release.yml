name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm and create/update the GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build release package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout pinned mmd-anim source
        run: git submodule update --init native/third_party/mmd-anim

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7
          actions-cache-folder: emsdk-cache

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Reject tracked generated web outputs
        run: node scripts/check-mmd-anim-artifacts.mjs --tracked-only

      - name: Build mmd-anim runtime artifact
        run: npm run build:mmd-anim

      - name: Build mmd-anim Bullet artifacts
        run: npm run build:bullet:mmd

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check fixtures
        run: npm run check:fixtures

      - name: Smoke dist exports
        run: npm run smoke:dist

      - name: Smoke TypeScript consumer
        run: npm run smoke:types

      - name: Verify mmd-anim ABI and artifact identity
        run: |
          npm run check:mmd-anim:artifacts
          node scripts/check-mmd-anim-artifacts.mjs --abi --verify-manifest artifacts/mmd-anim/manifest.json --strict-tools

      - name: Smoke mmd-anim Bullet ABI
        run: npm run smoke:bullet:mmd

      - name: Check package publishability
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.private === true) {
            throw new Error('package.json still has "private": true. Remove it before publishing.');
          }
          if (!pkg.name || !pkg.version) {
            throw new Error('package.json must include name and version before publishing.');
          }
          NODE

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          if (tag !== `v${pkg.version}`) {
            throw new Error(`Tag ${tag} does not match package version v${pkg.version}.`);
          }
          NODE

      - name: Inspect npm package contents
        run: |
          npm pack --dry-run --json > npm-pack-dry-run.json
          node scripts/check-package-tarball.mjs --dry-run npm-pack-dry-run.json

      - name: Create and hash npm package
        run: |
          npm pack --json > npm-pack.json
          package_file="$(ls ./*.tgz | head -n 1)"
          node scripts/check-package-tarball.mjs --package "$package_file" --write-hash npm-package.sha256

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            *.tgz
            npm-pack.json
            npm-pack-dry-run.json
            npm-package.sha256
            artifacts/mmd-anim/manifest.json
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish

    permissions:
      contents: write
      id-token: write

    environment:
      name: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Verify exact package artifact
        run: |
          package_file="$(ls ./*.tgz | head -n 1)"
          node scripts/check-package-tarball.mjs --package "$package_file" --expected-hash npm-package.sha256

      - name: Publish to npm
        run: npm publish "$(ls ./*.tgz | head -n 1)" --access public

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const lines = changelog.split(/\r?\n/);
          const heading = `## [${pkg.version}]`;
          const start = lines.findIndex((line) => line.startsWith(heading));
          if (start === -1) {
            throw new Error(`CHANGELOG.md does not contain a ## [${pkg.version}] section.`);
          }
          const endOffset = lines
            .slice(start + 1)
            .findIndex((line) => line.startsWith('## ['));
          const end = endOffset === -1 ? lines.length : start + 1 + endOffset;
          const notes = lines.slice(start + 1, end).join('\n').trim();
          if (!notes) {
            throw new Error(`CHANGELOG.md section ## [${pkg.version}] is empty.`);
          }

          fs.writeFileSync('release-notes.md', `${notes}\n`);
          NODE

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          package_file="$(ls ./*.tgz | head -n 1)"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-notes.md
            gh release upload "$tag" "$package_file" --clobber
          else
            gh release create "$tag" "$package_file" --notes-file release-notes.md --verify-tag
          fi
