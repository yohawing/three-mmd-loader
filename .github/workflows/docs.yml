name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout pinned mmd-anim source
        run: git submodule update --init native/third_party/mmd-anim

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      # TypeDoc type-checks src/, which imports the generated runtime wasm
      # bindings; those are build outputs and are not tracked in Git.
      - name: Build mmd-anim runtime artifact
        run: npm run build:mmd-anim

      - name: Prepare generated wasm bindings
        run: node scripts/prepare-mmd-anim-wasm-source.mjs

      - name: Build docs site
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
